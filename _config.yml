title: IFIBIO Scientific Landscape
description: >-
  Interactive exploration of IFIBIO publications, scientific themes and collaboration networks.

# Jekyll is the single presentation layer. Just the Docs provides a stable,
# accessible and highly customizable shell; dashboard styling lives in
# assets/css/custom.css.
remote_theme: just-the-docs/just-the-docs@v0.8.0
plugins:
  - jekyll-remote-theme

color_scheme: light
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
nav_sort: case_insensitive

footer_content: >-
  IFIBIO — Instituto de Fisiología y Biofísica Bernardo Houssay. Source on
  <a href="https://github.com/juanjosecas/ifibio">GitHub</a>.

aux_links:
  "IFIBIO on GitHub":
    - "https://github.com/juanjosecas/ifibio"
aux_links_new_tab: true

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default

# Keep the analysis repository and the published Jekyll site separate.
# Only browser-consumed CSV/JSON/GEXF files are copied to _site; Python
# intermediates, notebooks and rendered analysis figures stay in Git only.
exclude:
  - Gemfile
  - Gemfile.lock
  - FullNetwork.ipynb
  - all_pubmed_metadata_ifibio.csv
  - README.md
  - LICENSE
  - vendor
  - node_modules
  - .ipynb_checkpoints
  - .virtual_documents
  - .claude
  - .idea
  - .vscode
  - ml_pubmed_ifibio/**/*.pkl
  - ml_pubmed_ifibio/**/*.png
  - ml_pubmed_ifibio/**/*.graphml
  - ml_pubmed_ifibio/filiaciones/README.md
  - ml_pubmed_ifibio/filiaciones/filiaciones_llm.json
